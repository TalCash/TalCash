[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "technocoin"
version = "0.1.0.dev0"
description = "TechnoCoin: a small proof-of-work cryptocurrency (node, miner, wallet)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["PyNaCl>=1.5"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["technocoin*"]

[tool.setuptools.package-data]
"technocoin.crypto" = ["english.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
