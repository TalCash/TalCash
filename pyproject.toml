[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "talcash"
version = "0.1.0.dev0"
description = "TalCash: a small proof-of-work cryptocurrency (node, miner, wallet)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "PyNaCl>=1.5",        # Ed25519 signatures, Argon2id
    "fastapi>=0.115",     # node API
    "uvicorn>=0.35",      # node API server (the websockets-sansio mode)
    "websockets>=13",     # WebSocket support for uvicorn, and peer connections
    "httpx>=0.27",        # wallet -> node client
]

[project.scripts]
tc = "talcash.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["talcash*"]

[tool.setuptools.package-data]
"talcash.crypto" = ["english.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
